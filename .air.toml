# Powers `task dev`'s restart-on-save for the Go bot; `task dev` runs air
# alongside the Vite watch build (see Taskfile.yml).
#
# air watches the cmd/ and internal/ trees. Including .html/.js/.css (not just
# .go) is how a frontend edit flows through in `task dev`: Vite's watch build
# rewrites internal/web/dist/, air rebuilds, and the //go:embed copy refreshes —
# no dev-server proxy, no manual restart.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/fpldiscord ./cmd/fpldiscord"
  bin = "./tmp/fpldiscord"
  include_dir = ["cmd", "internal"]
  include_ext = ["go", "html", "js", "css"]
  exclude_dir = ["web", "legacy", ".scratch", "tmp", "bin"]
  exclude_regex = ["_test.go"]
  stop_on_error = true
  delay = 1000
  kill_delay = "2s"
  send_interrupt = false

  [build.windows]
    cmd = "go build -o ./tmp/fpldiscord.exe ./cmd/fpldiscord"
    bin = "tmp\\fpldiscord.exe"

[log]
  time = false

[misc]
  clean_on_exit = true
