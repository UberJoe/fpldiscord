app = "fpldiscord"
primary_region = "lhr"

[build]

[env]
  LEAGUE_ID = "64"
  SEASON = "2026/27"
  DB_PATH = "/data/fpldiscord.db"
  PORT = "8080"
  LOG_LEVEL = "info"
  GOMEMLIMIT = "230MiB"

[[mounts]]
  source = "fpldiscord_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    grace_period = "45s"
    interval = "15s"
    timeout = "5s"

[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
